<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Placement Drive</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Create a Drive</a>
                    <div class="collapse navbar-collapse">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link text-primary fw-bold" href="/company_dashboard">Go Back</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-danger fw-bold" href="/login">Log Out</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <div id="content" class="p-4 d-flex justify-content-center">
                <div class="border p-4 rounded bg-light shadow-sm" style="width: 500px;">
                    <h4 class="mb-3 text-center">Drive Details</h4>
                    <form action="/create_drive" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Drive Name / Category</label>
                            <input type="text" class="form-control" name="drive_name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Job Title</label>
                            <input type="text" class="form-control" name="job_title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Eligibility Criteria</label>
                            <input type="text" class="form-control" name="eligibility" placeholder="e.g. CS/IT > 7 CGPA" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Application Deadline</label>
                            <input type="datetime-local" class="form-control" name="deadline" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Initial Status</label>
                            <select class="form-select" name="status">
                                <option value="Upcoming">Upcoming</option>
                                <option value="Ongoing">Ongoing</option>
                            </select>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary w-100">Post Drive</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
