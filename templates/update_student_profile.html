<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Update Profile</a>
                    <div class="collapse navbar-collapse">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link text-primary fw-bold" href="/student_dashboard">Go Back</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-danger fw-bold" href="/login">Log Out</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <div id="content" class="p-4 d-flex justify-content-center">
                <div class="border p-4 rounded bg-light shadow-sm" style="width: 400px;">
                    <h4 class="mb-4 text-center">Edit Your Details</h4>
                    <form action="/update_student_profile" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="name" value="{{ student.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Resume Link (G-Drive / Link)</label>
                            <input type="url" class="form-control" name="resume" value="{{ student.resume }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">About You</label>
                            <textarea class="form-control" name="about" rows="4">{{ student.about }}</textarea>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
