<!DOCTYPE html>
<html lang="en">
<head>
    <title>Success - Placement Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="canvas" class="overflow-auto d-flex justify-content-center align-items-center" style="height: 100vh;">
            <div class="border rounded bg-light shadow-sm" style="width: 400px; text-align: center; overflow: hidden;">
                <div class="bg-success text-white p-3">
                    <h4 class="m-0">Success!</h4>
                </div>
                <div class="p-4">
                    <p class="fs-5 mb-4">{{ message }}</p>
                    <a href="{{ link }}" class="btn btn-primary w-100">Continue</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
