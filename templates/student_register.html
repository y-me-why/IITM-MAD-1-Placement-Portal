<!DOCTYPE html>
<html lang="en">
<head>
    <title>Complete Student Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Complete Your Profile</a>
                    <div class="collapse navbar-collapse">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link text-danger fw-bold" href="/login">Cancel & Log Out</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <div id="content" class="p-4 d-flex justify-content-center">
                <div class="border p-4 rounded bg-light shadow-sm" style="width: 500px;">
                    <h4 class="mb-3 text-center">Student Details</h4>
                    <form action="/student_register" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Year of Graduation (YOE)</label>
                            <input type="number" class="form-control" name="yoe" placeholder="e.g. 2026" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Resume Link (G-Drive / Portfolio)</label>
                            <input type="url" class="form-control" name="resume">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">About You (Bio)</label>
                            <textarea class="form-control" name="about" rows="3"></textarea>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary w-100">Finish Registration</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
