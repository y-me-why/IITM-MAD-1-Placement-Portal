<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Placement Drive</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Edit Drive #{{ drive.id }}</a>
                    <div class="collapse navbar-collapse">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link text-primary fw-bold" href="/company_dashboard">Go Back</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <div id="content" class="p-4 d-flex justify-content-center">
                <div class="border p-4 rounded bg-light shadow-sm" style="width: 500px;">
                    <form action="/edit_drive/{{ drive.id }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Drive Name / Category</label>
                            <input type="text" class="form-control" name="drive_name" value="{{ drive.drive_name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Job Title</label>
                            <input type="text" class="form-control" name="job_title" value="{{ drive.job_title }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3" required>{{ drive.description }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Eligibility Criteria</label>
                            <input type="text" class="form-control" name="eligibility" value="{{ drive.eligibility }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Drive Status</label>
                            <select class="form-select" name="status">
                                <option value="Upcoming" {% if drive.status == 'Upcoming' %}selected{% endif %}>Upcoming</option>
                                <option value="Ongoing" {% if drive.status == 'Ongoing' %}selected{% endif %}>Ongoing</option>
                                <option value="Closed" {% if drive.status == 'Closed' %}selected{% endif %}>Closed</option>
                            </select>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-warning w-100 fw-bold">Update Drive</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
