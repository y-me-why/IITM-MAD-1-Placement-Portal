<!DOCTYPE html>
<html lang="en">
<head>
    <title>Placement Portal - Register</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Placement Portal</a>
                </div>
            </nav>

            <div id="content" class="p-4 d-flex justify-content-center align-items-center" style="height: 60vh;">
                <div class="border p-4 rounded bg-light shadow-sm" style="width: 350px;">
                    <h2 class="text-center mb-4">Create Account</h2>
                    <form action="/register" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">I am registering as a:</label>
                            <select class="form-select" name="role" required>
                                <option value="" disabled selected>Select your role...</option>
                                <option value="student">Student</option>
                                <option value="company">Company</option>
                            </select>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary w-100">Next Step</button>
                            <p class="mt-3">Already have an account? <a href="/login">Login</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
