<!DOCTYPE html>
<html lang="en">
<head>
    <title>Complete Company Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Register Organization</a>
                    <div class="collapse navbar-collapse">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link text-danger fw-bold" href="/login">Cancel & Log Out</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <div id="content" class="p-4 d-flex justify-content-center">
                <div class="border p-4 rounded bg-light shadow-sm" style="width: 500px;">
                    <h4 class="mb-3 text-center">Company Details</h4>
                    <form action="/company_registration" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Company Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Corporate Identification Number (CIN)</label>
                            <input type="text" class="form-control" name="cin" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Official Website</label>
                            <input type="url" class="form-control" name="website" placeholder="https://..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">HR Contact Number</label>
                            <input type="text" class="form-control" name="phone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Headquarters Address</label>
                            <textarea class="form-control" name="address" rows="2" required></textarea>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary w-100">Submit for Admin Approval</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
